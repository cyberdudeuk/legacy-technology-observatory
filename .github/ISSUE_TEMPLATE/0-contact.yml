name: Contact the observatory
description: Questions, feedback, access needs or anything else. This is the only way to get in touch; we never publish an email address.
title: "[Contact] "
labels: ["contact"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for getting in touch. What you write here is **public**, so please don't include names, contact details, personal data or anything with a protective marking. We reply on this issue, usually within 10 working days.

        - Security problem? Use the [security policy](https://github.com/cyberdudeuk/legacy-code-observatory/security/policy) so it stays private.
        - No GitHub account, or need another format? Ask someone who has one to post for you, or describe your access need below.
  - type: dropdown
    id: topic
    attributes:
      label: What is it about?
      options:
        - General question
        - Feedback on the site
        - Accessibility problem
        - Something else
    validations: {required: true}
  - type: textarea
    id: message
    attributes:
      label: Your message
      description: If it's about a page, give the section name or address.
    validations: {required: true}
  - type: checkboxes
    id: public
    attributes:
      label: Before you send
      options:
        - label: I understand this message is public, and I haven't included personal or sensitive information.
          required: true
