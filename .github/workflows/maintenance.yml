# Monthly: check every source link and whether the evidence is due for review, and keep one
# "Maintenance needed" issue up to date (opened, updated or closed). Nothing to do by hand unless it opens.
name: Monthly maintenance
on:
  schedule: [{cron: "41 6 3 * *"}]
  workflow_dispatch:
permissions: {contents: read, issues: write}
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.12"}
      - id: check
        run: python tools/maintenance.py --out maintenance-report.md
        continue-on-error: true
      - if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = require('fs').readFileSync('maintenance-report.md', 'utf8');
            const needed = '${{ steps.check.outcome }}' === 'failure';
            const open = (await github.rest.issues.listForRepo({...context.repo, state: 'open', labels: 'maintenance'})).data;
            if (needed && open.length) await github.rest.issues.update({...context.repo, issue_number: open[0].number, body});
            else if (needed) await github.rest.issues.create({...context.repo, title: 'Maintenance needed', body, labels: ['maintenance']});
            else for (const i of open) {
              await github.rest.issues.createComment({...context.repo, issue_number: i.number, body: 'All links work and the evidence is current. Closing.'});
              await github.rest.issues.update({...context.repo, issue_number: i.number, state: 'closed'});
            }
